name: Fanbread
description: Fanbread is a defunct venture-backed company originally surfaced as a portfolio
  company of 500 Global and added to the API Evangelist network as an enrichment lead.
  Its primary domain fanbread.com no longer resolves to a live site — the HTTPS handshake
  fails and HTTP returns 410 Gone from a parking host — and no website, developer portal,
  documentation, API reference, or machine-readable API surface remains anywhere. The
  company's GitHub organization survives under the login FanBread but is now titled
  "Wild Sky Media FnB" and points at wildskymedia.com; its seven public repositories are
  forks and small front-end utilities with no first-party API artifacts and no activity
  since April 2020. This profile is retained as a historical record and a dead-domain
  marker, not as an active API provider.
